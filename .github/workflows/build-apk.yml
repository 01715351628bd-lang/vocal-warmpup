name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional version name (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          sdkmanager --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Setup Gradle & Dependency Caching
        uses: gradle/actions/setup-gradle@v5

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web assets and sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Resolve app version
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VER_NAME="${RAW_TAG#v}"
          elif [ -n "$INPUT_RELEASE_VERSION" ]; then
            VER_NAME="${INPUT_RELEASE_VERSION#v}"
          else
            VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION_NAME=${VER_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Verify Android Gradle project files
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK signature with apksigner
        run: |
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK"

      - name: Detect Android release signing secrets
        id: signing
        env:
          SECRET_KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "All four Android release signing secrets detected."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are missing or incomplete; skipping assembleRelease."
          fi

      - name: Build Signed Release APK with Gradle (optional)
        id: release_build
        if: steps.signing.outputs.has_signing == 'true'
        continue-on-error: true
        env:
          SECRET_KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "${RUNNER_TEMP}/release.jks"' EXIT
          echo "$SECRET_KS_B64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="${SECRET_KS_PASS}"
          export ANDROID_KEY_ALIAS="${SECRET_KEY_ALIAS}"
          export ANDROID_KEY_PASSWORD="${SECRET_KEY_PASS}"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Signed Release APK signature with apksigner
        id: release_verify
        if: steps.signing.outputs.has_signing == 'true' && steps.release_build.outcome == 'success'
        continue-on-error: true
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"

      - name: Prepare versioned APK files
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
          RELEASE_VERIFY_OUTCOME: ${{ steps.release_verify.outcome }}
        run: |
          mkdir -p build-artifacts
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Expected debug APK not found at $DEBUG_APK"
            exit 1
          fi
          DEBUG_OUT="build-artifacts/Vocal-Warm-up-Studio-v${APP_VERSION_NAME}-debug.apk"
          cp "$DEBUG_APK" "$DEBUG_OUT"

          if [ "$HAS_SIGNING" = "true" ] && [ "$RELEASE_VERIFY_OUTCOME" = "success" ] && [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            RELEASE_OUT="build-artifacts/Vocal-Warm-up-Studio-v${APP_VERSION_NAME}-release.apk"
            cp "android/app/build/outputs/apk/release/app-release.apk" "$RELEASE_OUT"
            echo "HAS_RELEASE_APK=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_APK=false" >> "$GITHUB_ENV"
            if [ "$HAS_SIGNING" = "true" ]; then
              echo "::warning::Optional release APK build/verification did not succeed; proceeding with verified debug APK."
            fi
          fi

          ls -lh build-artifacts/

      - name: Upload Debug APK (Direct Download)
        uses: actions/upload-artifact@v7
        with:
          name: Vocal-Warm-up-Studio-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK (Direct Download)
        if: steps.signing.outputs.has_signing == 'true' && steps.release_verify.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Vocal-Warm-up-Studio-v${{ env.APP_VERSION_NAME }}-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$HAS_RELEASE_APK" = "true" ]; then
            SIGNING_INFO="Signed release APK (\`Vocal-Warm-up-Studio-v${APP_VERSION_NAME}-release.apk\`) + debug-signed APK attached (both verified with \`apksigner\`)."
          else
            SIGNING_INFO="Installable debug-signed APK (\`Vocal-Warm-up-Studio-v${APP_VERSION_NAME}-debug.apk\`) verified with \`apksigner\`. (Release signing secrets not configured.)"
          fi

          cat <<EOF > "${RUNNER_TEMP}/release-notes.md"
          ## Vocal Warm-up Studio ${TAG_NAME}

          Compiled remotely with GitHub Actions (Java 21 + Android SDK 36 + Gradle).

          - **Version:** \`${APP_VERSION_NAME}\` (build \`${APP_VERSION_CODE}\`)
          - **Package ID:** \`com.vocalwarmup.studio\`
          - **Build Output:** ${SIGNING_INFO}

          ### How to Install on Android
          1. Download the \`.apk\` file from **Assets** below.
          2. Open the downloaded file on your Android phone.
          3. Allow **"Install unknown apps"** when prompted, then tap **Install**.
          EOF

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Vocal Warm-up Studio v${{ env.APP_VERSION_NAME }}
          files: build-artifacts/*.apk
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
